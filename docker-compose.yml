services:
  # One-shot migration gate: applies pending Prisma migrations, then exits.
  # `app` waits for it, so the API never boots against a stale schema.
  migrate:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-grub}:${POSTGRES_PASSWORD:-grub}@postgres:5432/${POSTGRES_DB:-grubmedia}?schema=public}
    depends_on:
      postgres:
        condition: service_healthy
    command: ['npx', 'prisma', 'migrate', 'deploy']

  app:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      # Compose-network defaults. In production set DATABASE_URL (and the
      # POSTGRES_* vars below) from secrets — never rely on these fallbacks.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-grub}:${POSTGRES_PASSWORD:-grub}@postgres:5432/${POSTGRES_DB:-grubmedia}?schema=public}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    ports:
      - '${APP_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    # PostGIS image (not vanilla postgres): advert_control migration creates a
    # geometry(Point, 4326) column + GiST index, which needs the extension.
    image: postgis/postgis:16-3.4-alpine
    environment:
      # WARNING: `grub` defaults are for local dev only. Production MUST set
      # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB from secrets.
      POSTGRES_USER: ${POSTGRES_USER:-grub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grub}
      POSTGRES_DB: ${POSTGRES_DB:-grubmedia}
    # No host port published: the database is reachable only inside the
    # compose network. For local debugging add a ports override file.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-grub} -d $${POSTGRES_DB:-grubmedia}']
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # No host port published (see postgres note above). Set REDIS_PASSWORD in
    # .env for production; the app reads it via REDIS_PASSWORD (empty = no auth).
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
