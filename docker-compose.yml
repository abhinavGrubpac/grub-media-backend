services:
  app:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      # Override hosts to the compose network service names.
      DATABASE_URL: postgresql://grub:grub@postgres:5432/grubmedia?schema=public
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: grub
      POSTGRES_PASSWORD: grub
      POSTGRES_DB: grubmedia
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U grub -d grubmedia']
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
