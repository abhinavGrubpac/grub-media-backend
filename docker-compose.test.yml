services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: grub
      POSTGRES_PASSWORD: grub
      POSTGRES_DB: grub_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U grub -d grub_test']
      interval: 5s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
